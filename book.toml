[book]
authors = ["JYU"]
language = "fi"
src = "src"
title = "Ohjelmointi 1"

[build]
create-missing = false

[output.html]
site-url = "/ohj1/"
edit-url-template = "https://github.com/ohj-perus-jy/ohj1/edit/main/{path}"
additional-css = [ 
  "highlight/atelier-forest-light.css",
  "highlight/twilight.css",
  "highlight/apprentice.css",
  "theme/accordion.css",
  "theme/alerts-style.css",
  "theme/asciinema-player.css",
  "theme/codeblock-tabs.css",
  "theme/code-highlights.css",
  "theme/tasks.css",
]
default-theme = "jyu-light"
preferred-dark-theme = "jyu-dark"
additional-js = [
  "mermaid/mermaid.min.js", 
  "mermaid/mermaid-init.js",
  "theme/playground_ext.js",
  "theme/accordion.js",
  "theme/codeblock-tabs.js",
  "theme/code-highlights.js",
  "theme/asciinema-player.min.js",
  "theme/asciinema-component.js",
]

[output.html.playground]
editable = true

[output.html.code.hidelines]
csharp = "//-"

[preprocessor.alerts]

[preprocessor.mermaid]

[preprocessor.katex]

[preprocessor.codeblock-tabs]

[preprocessor.accordion]
command = "python3 ./preprocessors/python/accordion.py"

[preprocessor.embedify]


[preprocessor.plantuml]
plantuml-cmd="https://www.plantuml.com/plantuml"

[preprocessor.inline-highlighting]

[preprocessor.svgbob]
font_size = 14
font_family = "var(--mono-font)"
fill_color = "black"
background = "transparent"               # default overridden, differs from svgbob's default
stroke_color = "var(--fg)"               # default overridden, differs from svgbob's default
stroke_width = 2.0
scale = 8.0
include_backdrop = true
include_styles = true
include_defs = true

# preprocessor configuration:
code_block = "bob"                       # render only code-blocks marked as "bob", e.g.: ```bob
    <line x1="176" y1="40" x2="256" y2="40" class="solid"></line>
    <path d="M 260,36 A 4,4 0,0,1 256,40" class="nofill"></path>
  </g>
  <g>
    <line x1="68" y1="60" x2="68" y2="84" class="solid"></line>
    <path d="M 68,84 A 4,4 0,0,0 72,88" class="nofill"></path>
    <line x1="72" y1="88" x2="208" y2="88" class="solid"></line>
    <line x1="212" y1="48" x2="212" y2="84" class="solid"></line>

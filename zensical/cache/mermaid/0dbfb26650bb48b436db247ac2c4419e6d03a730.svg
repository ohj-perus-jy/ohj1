<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 347.543 472.96999999999997" width="347.543" height="472.96999999999997" style="--bg:#FFFFFF;--fg:#27272A">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="ehto" data-to="lohko" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="kyllä" points="167.35833333333332,169.05833333333334 167.35833333333332,230.87 138.77999999999997,230.87 138.77999999999997,311.17" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="ehto" data-to="jatko" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="ei" points="218.98166666666665,169.05833333333334 218.98166666666665,230.87 247.55999999999997,230.87 247.55999999999997,384.07 230.04866666666663,384.07 230.04866666666663,396.07" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="lohko" data-to="jatko" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="138.77999999999997,348.07 138.77999999999997,384.07 156.2913333333333,384.07 156.2913333333333,396.07" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="ehto" data-to="lohko" data-label="kyllä">
  <rect x="118.28" y="237.87" width="40.221999999999994" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="138.391" y="253.02" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">kyllä</text>
</g>
<g class="edge-label" data-from="ehto" data-to="jatko" data-label="ei">
  <rect x="234.55999999999997" y="237.87" width="25.966" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="247.54299999999998" y="253.02" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">ei</text>
</g>
<g class="node" data-id="ehto" data-label="Onko ehto tosi?" data-shape="diamond">
  <polygon points="193.17,40 270.605,117.435 193.17,194.87 115.73499999999999,117.435" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="193.17" y="117.435" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Onko ehto tosi?</text>
</g>

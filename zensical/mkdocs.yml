# Kirjan omat Zensical-asetukset. Yhteiset asetukset (teema, tyylit, skriptit)
# ja navigaatio tulevat nav.yml:stä, jonka tyokalut/convert.py kirjoittaa
# tiedostosta tyokalut/mkdocs-pohja.yml; tämän tiedoston arvo voittaa.
INHERIT: nav.yml

site_name: Ohjelmointi 1

# Alatunniste: tekijät ja lisenssi. Arvo menee malliin escapettamatta, joten
# HTML on sallittu.
copyright: >-
  Ohjelmointi 1 -oppimateriaali &copy; 2025 Denis Zhidkikh, Sami Sarsa,
  Antti-Jussi Lakanen &middot;
  <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fi"
  rel="license" title="Creative Commons Nimeä-JaaSamoin 4.0
  Kansainvälinen">CC BY-SA 4.0</a>

# Muokkauslinkin repo; edit_uri tulee pohjasta.
repo_url: https://github.com/ohj-perus-jy/ohj1

# Sivustovalikko yläpalkissa kurssin nimen vieressä (overrides/partials/
# header.html). Kohta, jonka nimi on site_name, on tämä sivusto ja vie omalle
# etusivulle; muut vievät url-osoitteeseen. nav.yml:n extra yhdistyy tähän.
extra:
  sites:
    - name: Ohjelmointi 1
      url: https://ohjelmointi1.it.jyu.fi/
    - name: Jypeli-ohjeet
      url: https://jypeli.it.jyu.fi/

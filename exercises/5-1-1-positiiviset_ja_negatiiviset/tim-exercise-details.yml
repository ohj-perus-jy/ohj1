# Tehtävän tyyppi
# Vastaa TIMin pluginin tyyppiä.
# Sallitut arvot ovat TIMin plugin-typit sekä seuraavat aliakset:
#   - code = csPlugin
#   - quiz = qst
exerciseType: code
type: csharp           # csPluginin oma asetus
title: "Positiiviset ja negatiiviset"  # csPluginin oma asetus
# Kuinka monta pistettä tehtävästä saa
# Tämä sallii kahdenlaista arvoa:
#   - Luku => silloin kaikkien testien pitää mennä läpi, jotta saa pisteet
#   - Olio, jolla voi määrittää osapisteitä
points:
  max: 1
  # Luetaanko pisteet testeistä. 
  # Jos true, pistemäärä lasketaan ajamalla testit ja hakemalla pisteet sen tulosteesta.
  # Pisteemäärä haetaan regexilla: "RANDOMCHECK: (.*)\n"
  readFromTests: true
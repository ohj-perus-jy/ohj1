Binäärilukujärjestelmässä on kaksi numeroa, nolla ja yksi. Yhtä tällaista arvoa 
sanotaan bitiksi (*bit*, binary digit). Vähiten merkitsevä eli 
viimeisimmäksi kirjoitettu bitti tarkoittaa 10-järjestelmän lukua yksi, 
toiseksi vähiten merkitsevä bitti lukua kaksi, kolmanneksi vähiten 
merkitsevä lukumäärää neljä ja niin edelleen aina kakkosen potensseja 
jatkaen (8, 16, 32, 64, ...). Kokonaisen binääriluvun ilmoittama lukumäärä 
saadaan kun summataan nämä yksittäisten bittien ilmoittamat lukumäärät toisiinsa. 
Esimerkiksi binääriluku 1000101 olisi kymmenjärjestelmässä

```
1*64 + 0*32 + 0*16 + 0*8 + 1*4 + 0*2 + 1*1 == 69

```

**Arviointi:** Yhteenlaskettu maksimipistemäärä on 1 p. 
Kysymyskohtaiset pisteet näkyvät kysymysten yhteydessä.


Jos käytetään suoraa tulkitaa (merkitsevin bitti määrää neg/pos), niin
suurin on

~~~
0111 1111 1111 1111 1111 1111 1111 1111 = 2147483648-1  =  2147483647
~~~

ja pienin

~~~
1111 1111 1111 1111 1111 1111 1111 1111 = -2147483646+1 = -2147483647
~~~

Suorassa tulkinnassa on nollalle on kaksi esitystapaa. 
Sen sijaan 2-komplementissa nollalle on vain yksi esitystapa, jolloin
saadaan tilaa yhdelle negaatiiviselle luvulle lisää, eli
silloin pienin on `-2147483648`.

!!

type: text
stem: |!!
md:

Entä jos pitää voida esittää positiivisia ja negatiivisia 
lukuja: mikä silloin on toisaalta pienin ja toisaalta suurin luku, 
joka neljän tavun kokoiseen tilaan mahtuu?
**Kirjoita ensin isoin luku ja sen jälkeen pienin.** 
Tässäkin vastaus annetaan
10-järjestelmän lukuina. 

Huom: Voit tehdä itse valinnan, onko negatiivisille
